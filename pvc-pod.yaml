apiVersion: v1
kind: Pod
metadata:
  labels:
    app: myapp
  name: test
spec:
  containers:
  - image: nginx:latest
    name: test
    ports:
    - containerPort: 80
    volumeMounts:
    - name: myvol
      mountPath: /data
  volumes:
  - name: myvol
    persistentVolumeClaim: 
      claimName: mypvc
