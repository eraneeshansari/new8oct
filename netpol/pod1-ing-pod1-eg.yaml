apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod2-ing-pod2-eg-for-pod1
spec:
  podSelector:
    matchLabels:
      run: pod1
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          run: pod2
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          run: pod2
    ports:
    - protocol: TCP
      port: 80


