apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pod1-ing-pod1-eg-for-pod2
spec:
  podSelector:
    matchLabels:
      run: pod2
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          run: pod1
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          run: pod1
    ports:
    - protocol: TCP
      port: 80


