apiVersion: v1
kind: Pod
metadata:
  labels:
    app: test-secret
  name: test-appcrt
spec:
  containers:
  - image: wordpress:latest
    name: con1
    ports:
    - containerPort: 80
    volumeMounts:
    - name: myvol
      mountPath: /app
  volumes:
  - name: myvol
    secret:
      secretName: appcrt 
---

